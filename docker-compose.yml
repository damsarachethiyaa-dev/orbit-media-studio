services:
  # Optional YouTube token service; it does not guarantee access from blocked IPs.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    init: true

  orbit-engine:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - '4318'
    volumes:
      - orbit-media:/app/.media
      - ./.secrets/cookies:/app/secrets/cookies:ro
    environment:
      ORBIT_API_KEY: ${ORBIT_API_KEY}
      ORBIT_ALLOWED_ORIGINS: ${ORBIT_ALLOWED_ORIGINS}
      ORBIT_POT_PROVIDER_URL: http://bgutil-provider:4416
      ORBIT_COOKIES_DIR: /app/secrets/cookies
    depends_on:
      - bgutil-provider

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - orbit-engine

volumes:
  orbit-media:
  caddy-data:
  caddy-config:
